[project]
name = "face-recognition-python"
version = "1.2.4"
description = "Face detection and gender-classification desktop app (Python port of Java/JavaFX version)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # NOTE: opencv <5 only — 5.x removed DNN Caffe loader (readNetFromCaffe)
  # and CascadeClassifier used by SSD/Haar engines. Java baseline is 4.9.
  "opencv-python>=4.9,<5",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "PySide6>=6.7",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
face-recognition = "face_recognition.__main__:main"
face-recognition-cli = "face_recognition.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
