# Face Recognition Application Configuration

# Camera Settings
camera.frame.interval.ms=33
camera.buffer.size=1
camera.default.width=640
camera.default.height=480
camera.shutdown.timeout.ms=2000

# Detection Pipeline Settings
detection.interval.frames=5
detection.gender.prediction.interval=30
# While a track has fewer than min.votes, predict every warmup.interval frames
detection.gender.warmup.interval=4
# Votes needed before a gender label is shown (stops one bad frame flashing "Male")
detection.gender.min.votes=3
# A track must be confirmed by this many detections before gender runs at all
detection.gender.min.track.confirm=2
detection.gender.min.confidence=0.70
detection.gender.vote.window=5
# Skip gender prediction on crops smaller/blurrier/darker than this
detection.gender.min.face.px=56
detection.gender.min.sharpness=3.0
detection.gender.min.brightness=40.0
detection.gender.max.brightness=225.0
detection.exposure.retune.interval=120
detection.box.change.threshold=0.15
detection.min.face.size.ratio=0.07
detection.small.face.ratio=0.045

# YOLO Settings
yolo.confidence.threshold=0.65
yolo.nms.threshold=0.45
yolo.failures.before.cooldown=3
yolo.cooldown.frames=24

# SSD Settings
ssd.confidence.threshold=0.60

# Camera Exposure Settings
camera.exposure.target.brightness=165.0
camera.exposure.min.brightness=70.0
camera.exposure.meaningful.drop=10.0
camera.exposure.settle.ms=120
camera.exposure.manual.modes=1.0,0.25,0.0
camera.exposure.automatic.modes=3.0,0.75

# Tracker Settings
tracker.iou.threshold=0.45
tracker.match.threshold=0.58
tracker.search.expansion=0.45
tracker.rect.smoothing=0.60
tracker.max.missed.frames=6
# Unconfirmed tracks that survive on template matching only are dropped after
# this many frames. Must stay above detection.interval.frames (5), otherwise
# every track is pruned before the next detection can confirm it (ID churn).
tracker.tracked.only.grace.frames=12
# A detection mostly inside an existing track counts as the same face (stops
# a resized/zoomed box from spawning a second green rectangle).
tracker.containment.threshold=0.80
# A face moving between detection cycles keeps its track if its center moved
# less than this fraction of the face size (same size box assumed).
tracker.center.match.ratio=0.90
# Duplicate tracks whose centers are this close (and sizes similar) are merged.
tracker.center.merge.ratio=0.60
# Duplicate tracks that overlap this much are merged into one.
tracker.merge.iou=0.55
tracker.merge.containment=0.85

# Image Processing Settings
image.display.max.width=640

# Update Settings
update.check.timeout.seconds=5
# The bundled Windows installer is large (JRE, native libraries, and AI models).
# Keep enough time for a normal connection to finish the download.
update.download.timeout.seconds=600
update.github.api.url=https://api.github.com/repos/OniAntou/Face-Recognition/releases/latest
# Keep true for public releases with Authenticode-signed installers.
# Set false only for personal unsigned releases; SHA-256 verification remains mandatory.
update.require.authenticode=false
# Optional Authenticode publisher constraints used when signature verification is enabled.
update.trusted.signer.subject=
update.trusted.signer.thumbprint=

# Performance Settings
performance.ai.thread.priority=-1

# FPS Smoothing
fps.smoothing.factor=0.80

# Vision Preprocessing Settings (previously hard-coded)
# Brightness threshold for detecting overexposed scenes
vision.brightness.threshold=190.0
# Highlight pixel ratio threshold for overexposure detection
vision.highlight.ratio.threshold=0.16
# Gamma correction for heavily overexposed scenes
vision.aggressive.gamma=1.35
# Gamma correction for mildly overexposed scenes
vision.mild.gamma=1.10

# Haar Cascade Detector Settings (previously hard-coded)
# Minimum face size for detection (pixels)
haar.min.face.size=40
# Default confidence for Haar detections (0.0-1.0)
haar.default.confidence=0.75
# Scale factor between successive scans
haar.scale.factor=1.1
# Minimum neighbors for rectangle retention
haar.min.neighbors=7

# Detection Pipeline Filter Settings (previously hard-coded)
# Minimum aspect ratio for face detection (width/height)
detection.min.aspect.ratio=0.5
# Maximum aspect ratio for face detection (width/height)
detection.max.aspect.ratio=1.6
# Deduplicate overlapping detector boxes (SSD can return several boxes for one face)
detection.nms.iou=0.45
detection.nms.containment=0.85

# Logging Settings
logging.level.com.example.facedetection=INFO
logging.level.org.opencv=WARN
logging.level.javafx=WARN
